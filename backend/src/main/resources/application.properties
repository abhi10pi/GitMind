spring.application.name=backend

# ── Database ──────────────────────────────────────────────────────────────────
# Defaults match docker-compose.yml (postgres service on internal port 5432)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/gitmind}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── AI Provider ───────────────────────────────────────────────────────────────
# Choose: groq | openai
ai.provider=${AI_PROVIDER:groq}

# ── Groq (free chat — https://console.groq.com) ───────────────────────────
groq.api-key=${GROQ_API_KEY:}
groq.chat.model=${GROQ_CHAT_MODEL:openai/gpt-oss-120b}

# ── OpenAI (optional chat fallback when AI_PROVIDER=openai) ────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}

# ── Mistral AI (free embeddings — https://console.mistral.ai) ──────────────
# mistral-embed → 1024 dims — set PGVECTOR_DIMENSIONS=1024
mistral.api-key=${MISTRAL_API_KEY:}
mistral.embedding.model=${MISTRAL_EMBEDDING_MODEL:mistral-embed}

# AiConfig.java wires the active provider's beans directly.
# Disable ALL OpenAI and Mistral auto-configurations so they don't require credentials at startup.
spring.autoconfigure.exclude=\
  org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration,\
  org.springframework.ai.model.mistralai.autoconfigure.MistralAiChatAutoConfiguration,\
  org.springframework.ai.model.mistralai.autoconfigure.MistralAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.mistralai.autoconfigure.MistralAiModerationAutoConfiguration

# ── GitHub OAuth2 ─────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

# ── pgvector ──────────────────────────────────────────────────────────────────
# Mistral mistral-embed → 1024 dims
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=${PGVECTOR_DIMENSIONS:1024}
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# ── Session ───────────────────────────────────────────────────────────────────
server.servlet.session.cookie.name=GITMIND_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# ── App ───────────────────────────────────────────────────────────────────────
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:gitmind-local-encrypt-key-change-me}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50
